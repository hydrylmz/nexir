[workspace]
members = [
    ".",
    "ui"
]

[package]
name = "nexir"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
wgpu = { version = "0.19.4", features = ["wgsl"] }
pollster = "0.3"
raw-window-handle = "0.6"
half = "2"
rayon = "1.10"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.12"
cpal = "0.15"
num_cpus = "1"
wgpu-hal = "0.19.4"
ash = "0.38"
log = "0.4"

[dev-dependencies]
pollster = "0.3"

[build-dependencies]
pkg-config = "0.3"
cc = "1.0"

# ---------------------------------------------------------------------------
# Fast-dev profile: optimize the nexir engine and heavy deps at level 2 so
# that the hot-path (f16->u8 conversion, sws_scale, wgpu readback) gets SIMD
# autovectorisation even in `cargo run` debug builds.  The ui binary itself
# stays unoptimised for fast incremental rebuilds.
# ---------------------------------------------------------------------------
[profile.dev.package.nexir]
opt-level = 2

[profile.dev.package.half]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.naga]
opt-level = 2

[profile.dev.package.rayon]
opt-level = 2

[profile.dev.package.dashmap]
opt-level = 2

[profile.dev.package.lru]
opt-level = 2
