[workspace]
members = [
    ".",
    "ui"
]

[workspace.package]
version = "0.1.2"

[package]
name = "nexir"
version.workspace = true
edition = "2021"
build = "build.rs"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
wgpu = { version = "0.19.4", features = ["wgsl"] }
pollster = "0.3"
raw-window-handle = "0.6"
half = "2"
rayon = "1.10"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.12"
cpal = "0.15"
num_cpus = "1"
wgpu-hal = "0.19.4"
ash = "0.38"
log = "0.4"
image = "0.24"
imageproc = "0.23.0"
rusttype = "0.9.3"

# Windows-only: the D3D12 escape hatch used by src/interop/external_texture.rs.
# Both are pinned to exactly what wgpu-hal 0.19 links, so the ID3D12Resource /
# ID3D12Device pointers handed across the boundary are the same COM types.
[target.'cfg(windows)'.dependencies]
d3d12 = "0.19.0"
# `psapi` + `processthreadsapi` are for src/profiling/sysinfo.rs (GetProcessMemoryInfo,
# GetProcessTimes) — the OS queries behind the RAM (RSS) and CPU Util rows, which
# must come from the OS or print n/a. `minwindef` provides FILETIME.
winapi = { version = "0.3", features = ["d3d12", "d3dcommon", "dxgiformat", "handleapi", "winerror", "winnt", "unknwnbase", "psapi", "processthreadsapi", "minwindef", "libloaderapi"] }

[dev-dependencies]
pollster = "0.3"
# Lets tests surface the engine's own log::info lines (notably which encoder
# backend ExportEngine selected) under RUST_LOG=info.
env_logger = "0.11"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = []

[build-dependencies]
pkg-config = "0.3"
cc = "1.0"

# ---------------------------------------------------------------------------
# Fast-dev profile: optimize the nexir engine and heavy deps at level 2 so
# that the hot-path (f16->u8 conversion, sws_scale, wgpu readback) gets SIMD
# autovectorisation even in `cargo run` debug builds.  The ui binary itself
# stays unoptimised for fast incremental rebuilds.
# ---------------------------------------------------------------------------
[profile.dev.package.nexir]
opt-level = 2

[profile.dev.package.half]
opt-level = 2

[profile.dev.package.wgpu]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.rayon]
opt-level = 2

[profile.dev.package.dashmap]
opt-level = 2

[profile.dev.package.lru]
opt-level = 2
